VIEWS.simulation={
  layer:'03', nav:'Simulation & faults', title:'Simulation and fault injection',
  desc:'Drive the plant model directly. Mission profiles fly themselves; manual mode gives you the throttle. Injected faults ramp in progressively, the way real degradation arrives, so you can watch detection latency rather than a step change.',
  build(){
    const root=el('div','grid g-1-2');
    const ctl=panel('Flight control','PLANT INPUT');
    const pf=el('label','fld');
    pf.innerHTML='<span>MISSION PROFILE</span>';
    this.selProfile=el('select');
    Object.entries(PROFILES).forEach(([k,v])=>{const o=el('option');o.value=k;o.textContent=v.name;this.selProfile.appendChild(o);});
    this.selProfile.value=S.profile;
    this.selProfile.onchange=()=>{S.profile=this.selProfile.value;S.seg=0;S.segT=0;
      pushEvent({type:'info',sev:0,txt:'Profile loaded: '+PROFILES[S.profile].name,sys:'Mission',t:S.t});
      toast('Profile loaded');};
    pf.appendChild(this.selProfile);ctl.body.appendChild(pf);

    const md=el('div');md.style.cssText='display:flex;gap:6px;margin-bottom:12px';
    this.bAuto=el('button','btn on','Autopilot');
    this.bMan=el('button','btn','Manual throttle');
    this.bAuto.onclick=()=>{S.mode='auto';this.bAuto.classList.add('on');this.bMan.classList.remove('on');};
    this.bMan.onclick=()=>{S.mode='manual';this.bMan.classList.add('on');this.bAuto.classList.remove('on');};
    md.appendChild(this.bAuto);md.appendChild(this.bMan);ctl.body.appendChild(md);

    const mk=(label,min,max,step,val,unit,fn)=>{
      const l=el('label','fld');
      const span=el('span');span.innerHTML=label+' <b class="mono" style="float:right;font-weight:500"></b>';
      l.appendChild(span);
      const i=el('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;
      const out=span.querySelector('b');out.textContent=(+val).toFixed(step<1?1:0)+' '+unit;
      i.oninput=()=>{out.textContent=(+i.value).toFixed(step<1?1:0)+' '+unit;fn(+i.value);};
      l.appendChild(i);l.out=out;l.input=i;return l;
    };
    this.sThr=mk('THROTTLE',0,100,1,16,'%',v=>{if(S.mode==='manual')S.cmd.throttle=v/100;});
    this.sAlt=mk('COMMANDED ALTITUDE',0,26000,100,0,'ft',v=>{if(S.mode==='manual')S.cmd.alt=v;});
    this.sOat=mk('SEA-LEVEL OAT',-20,50,1,24,'\u00B0C',v=>{S.cmd.oat=v;});
    [this.sThr,this.sAlt,this.sOat].forEach(x=>ctl.body.appendChild(x));

    const row=el('div');row.style.cssText='display:flex;gap:6px;flex-wrap:wrap';
    const bCut=el('button','btn','Cut ignition');
    bCut.onclick=()=>{S.armed=!S.armed;bCut.textContent=S.armed?'Cut ignition':'Restart engine';
      bCut.classList.toggle('on',!S.armed);
      if(S.armed)S.eng.starts++;
      pushEvent({type:'info',sev:S.armed?0:2,txt:S.armed?'Engine restart commanded':'Ignition cut commanded',sys:'Mission',t:S.t});};
    const bAge=el('button','btn','Age 25 h');
    bAge.onclick=()=>{for(let i=0;i<9000;i++)S.eng.step(10,S.cmd);S.eng.hours+=0;toast('Advanced 25 engine hours of wear');};
    row.appendChild(bCut);row.appendChild(bAge);
    ctl.body.appendChild(el('div','sep'));ctl.body.appendChild(row);
    root.appendChild(ctl);

    const fi=panel('Fault injection','11 SEEDED FAILURE MODES');
    this.fiWrap=el('div');fi.body.appendChild(this.fiWrap);
    FAULT_DEFS.forEach(f=>{
      const r=el('div','switchrow');
      const l=el('div');
      l.innerHTML=`<div class="nm">${f.name}</div><div class="sub">${f.sys} \u00B7 <span data-sev>0%</span></div>
        <div class="hint" style="margin-top:3px;max-width:60ch">${f.hint}</div>`;
      const t=el('button','toggle');t.setAttribute('aria-pressed','false');
      t.setAttribute('aria-label','Inject '+f.name);
      t.onclick=()=>{const on=t.getAttribute('aria-pressed')!=='true';
        t.setAttribute('aria-pressed',String(on));S.eng.setFault(f.id,on);
        pushEvent({type:'inject',sev:on?1:0,txt:(on?'Fault injected: ':'Fault cleared: ')+f.name,sys:f.sys,t:S.t});
        toast(on?'Injected: '+f.name:'Cleared: '+f.name);};
      r.appendChild(l);r.appendChild(t);
      r.sev=l.querySelector('[data-sev]');r.toggle=t;r.fid=f.id;
      this.fiWrap.appendChild(r);
    });
    const cl=el('button','btn','Clear all faults');
    cl.style.marginTop='12px';
    cl.onclick=()=>{S.eng.clearFaults();
      this.fiWrap.querySelectorAll('.toggle').forEach(t=>t.setAttribute('aria-pressed','false'));
      pushEvent({type:'inject',sev:0,txt:'All injected faults cleared',sys:'Mission',t:S.t});toast('All faults cleared');};
    fi.body.appendChild(cl);
    root.appendChild(fi);

    const pr=panel('Mission profile timeline','SEGMENTS');
    pr.body.className='panel-body tight';
    this.tl=el('div','timeline');this.tl.style.margin='8px';pr.body.appendChild(this.tl);
    pr.className+=' span2';root.appendChild(pr);
    return root;
  },
  update(S){
    if(S.mode==='auto'){
      this.sThr.input.value=S.cmd.throttle*100;this.sThr.out.textContent=(S.cmd.throttle*100).toFixed(0)+' %';
      this.sAlt.input.value=S.cmd.alt;this.sAlt.out.textContent=S.cmd.alt.toFixed(0)+' ft';
    }
    if(!this._t||performance.now()-this._t>300){
      this._t=performance.now();
      this.fiWrap.querySelectorAll('.switchrow').forEach(r=>{
        const sv=S.eng.faults[r.fid].sev;
        r.sev.textContent=(sv*100).toFixed(0)+'%';
        r.sev.className=sv>0.6?'wrn':sv>0.1?'cau':'';
      });
      const segs=PROFILES[S.profile].segs, total=segs.reduce((a,s)=>a+s.d,0);
      let acc=0;
      this.tl.innerHTML=segs.map((s,i)=>{
        const left=acc/total*100,wpc=s.d/total*100;acc+=s.d;
        const on=i===S.seg;
        return `<div class="seg" style="left:${left}%;width:${wpc}%;${on?'background:color-mix(in srgb,'+cssv('--caution')+' 16%,transparent);color:'+cssv('--caution'):''}">${s.ph}</div>`;
      }).join('')+`<div class="cursor" style="left:${clamp((segs.slice(0,S.seg).reduce((a,s)=>a+s.d,0)+S.segT)/total,0,1)*100}%"></div>`;
    }
  },
  seed(){}
};

VIEWS.replay={
  layer:'10', nav:'Mission replay', title:'Mission replay',
  desc:'The data recorder keeps a 1 Hz frame of every channel, the twin expectation, the anomaly score and any rule that was firing. Scrub back to the moment a caution appeared and read the whole engine state at that instant.',
  build(){
    const root=el('div','grid');
    const ctl=panel('Recorder','1 Hz \u00B7 2 h RING BUFFER');
    const bar_=el('div');bar_.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px';
    this.bEnter=el('button','btn primary','Enter replay');
    this.bPlay=el('button','btn','Play');
    this.bStep=el('button','btn mono','\u25C0 10 s');
    this.bStep2=el('button','btn mono','10 s \u25B6');
    this.bLive=el('button','btn','Return to live');
    this.tPos=el('span','mono dim');this.tPos.style.marginLeft='auto';
    [this.bEnter,this.bPlay,this.bStep,this.bStep2,this.bLive,this.tPos].forEach(x=>bar_.appendChild(x));
    ctl.body.appendChild(bar_);
    this.tl=el('div','timeline');ctl.body.appendChild(this.tl);
    this.scrub=el('input');this.scrub.type='range';this.scrub.min=0;this.scrub.max=1;this.scrub.step=1;this.scrub.value=0;
    ctl.body.appendChild(this.scrub);
    ctl.body.appendChild(el('div','hint','Markers on the strip are recorded events: amber for a caution, red for a warning, grey for a phase change.'));
    root.appendChild(ctl);

    this.bEnter.onclick=()=>{ if(!S.rec.buf.length){toast('Nothing recorded yet');return;}
      S.replay.mode=true;S.replay.t=S.rec.duration;this.scrub.value=S.rec.buf.length-1;this.render();toast('Replay mode');};
    this.bLive.onclick=()=>{S.replay.mode=false;S.replay.playing=false;this.bPlay.textContent='Play';toast('Live telemetry');};
    this.bPlay.onclick=()=>{if(!S.replay.mode)return;S.replay.playing=!S.replay.playing;
      this.bPlay.textContent=S.replay.playing?'Pause':'Play';};
    this.bStep.onclick=()=>this.step(-10);
    this.bStep2.onclick=()=>this.step(10);
    this.scrub.oninput=()=>{S.replay.mode=true;const f=S.rec.buf[+this.scrub.value];if(f){S.replay.t=f.t;this.render();}};

    const g=el('div','grid g2');
    const fr=panel('Frame state','AT CURSOR');
    fr.body.className='panel-body tight';
    const w=el('div','tbl-wrap');this.frTbl=el('table');w.appendChild(this.frTbl);fr.body.appendChild(w);
    g.appendChild(fr);
    const ev=panel('Events at this point','\u00B1 30 s');
    this.evLog=el('div','log');ev.body.appendChild(this.evLog);
    g.appendChild(ev);
    root.appendChild(g);

    const ch=panel('Recorded traces','FULL MISSION');
    ch.body.className='panel-body tight';
    this.ch=newChart({height:200,window:999999,series:[
      {key:'p',color:cssv('--nominal'),label:'Shaft power, hp'},
      {key:'c',color:cssv('--caution'),label:'CHT max, \u00B0C'},
      {key:'a',color:cssv('--warn'),label:'Anomaly \u00D7100'},
      {key:'h',color:cssv('--twin'),label:'Health index'}]});
    this.ch.mount(ch.body);
    root.appendChild(ch);
    return root;
  },
  step(d){ if(!S.rec.buf.length)return; S.replay.mode=true;
    const i=clamp(+this.scrub.value+d,0,S.rec.buf.length-1);
    this.scrub.value=i;const f=S.rec.buf[i];if(f){S.replay.t=f.t;this.render();} },
  update(S){
    if(S.replay.mode&&S.replay.playing){
      const i=+this.scrub.value+1;
      if(i>=S.rec.buf.length){S.replay.playing=false;this.bPlay.textContent='Play';}
      else{this.scrub.value=i;S.replay.t=S.rec.buf[i].t;}
    }
    if(!S.replay.mode){this.scrub.max=Math.max(1,S.rec.buf.length-1);
      if(!S.replay.playing)this.scrub.value=S.rec.buf.length-1;}
    this.bLive.classList.toggle('on',!S.replay.mode);
    this.bEnter.classList.toggle('on',S.replay.mode);
    if(!this._t||performance.now()-this._t>200){this._t=performance.now();this.render();}
  },
  render(){
    const buf=S.rec.buf;
    this.scrub.max=Math.max(1,buf.length-1);
    const f=buf[clamp(+this.scrub.value,0,buf.length-1)];
    this.tPos.textContent=S.replay.mode?('REPLAY '+hhmmss(f?f.t:0)+' / '+hhmmss(S.rec.duration)):('LIVE '+hhmmss(S.t));
    const dur=Math.max(1,S.rec.duration);
    this.tl.innerHTML=S.rec.events.map(e=>{
      const col=e.sev===2?cssv('--warn'):e.sev===1?cssv('--caution'):cssv('--ink-3');
      return `<div class="ev" style="left:${e.t/dur*100}%;background:${col};opacity:${e.sev?1:.45}" title="${e.txt}"></div>`;
    }).join('')+(f?`<div class="cursor" style="left:${f.t/dur*100}%"></div>`:'');

    if(f){
      const rows=[['Phase',f.phase,''],['Throttle',(f.throttle*100).toFixed(0),'%'],
        ['Altitude',f.alt.toFixed(0),'ft'],['RPM',f.m.rpm.toFixed(0),''],
        ['MAP',f.m.map.toFixed(2),'inHg'],['EGT max',Math.max(...f.m.egt).toFixed(0),'\u00B0C'],
        ['CHT max',Math.max(...f.m.cht).toFixed(1),'\u00B0C'],
        ['Oil pressure',f.m.oilP.toFixed(2),'bar'],['Oil temperature',f.m.oilT.toFixed(1),'\u00B0C'],
        ['Coolant',f.m.cltT.toFixed(1),'\u00B0C'],['Fuel flow',f.m.ff.toFixed(2),'L/h'],
        ['Vibration',f.m.vibRms.toFixed(2),'mm/s'],['Bus voltage',f.m.volt.toFixed(2),'V'],
        ['Shaft power',f.m.powerHp.toFixed(1),'hp'],['Twin power',f.e.powerHp.toFixed(1),'hp'],
        ['Anomaly score',f.anom.toFixed(3),''],['Health index',f.health.toFixed(1),''],
        ['Rules firing',f.rules.length?f.rules.join(' '):'none','']];
      this.frTbl.innerHTML='<thead><tr><th>Parameter</th><th class="num">Value</th><th>Unit</th></tr></thead><tbody>'+
        rows.map(([k,v,u])=>`<tr><td>${k}</td><td class="num">${v}</td><td class="dimmer mono" style="font-size:11px">${u}</td></tr>`).join('')+'</tbody>';
      const near=S.rec.events.filter(e=>Math.abs(e.t-f.t)<=30).slice(-14).reverse();
      renderLog(this.evLog,near);
    }
    this.ch.clear();
    const stride=Math.max(1,Math.floor(buf.length/600));
    for(let i=0;i<buf.length;i+=stride){const b=buf[i];
      this.ch.push(b.t,[b.m.powerHp,Math.max(...b.m.cht),b.anom*100,b.health]);}
    this.ch.o.window=Math.max(60,dur);
  },
  seed(){this.render();}
};

  renderReport(){

      <p class="mono dimmer" style="font-size:11px">UAV-04 "KESTREL" \u00B7 ENGINE S/N 914F-2207-18 \u00B7 GENERATED ${R.stamp}</p>`);

    h.push(`<table><tbody>
      <tr><td>Profile</td><td class="num">${s.profile}</td></tr>
      <tr><td>Elapsed time</td><td class="num">${hhmmss(s.met)}</td></tr>
      <tr><td>Final phase</td><td class="num">${s.phase}</td></tr>
      <tr><td>Engine hours since overhaul</td><td class="num">${fmt(s.hours,2)} h</td></tr>
      <tr><td>Fuel consumed</td><td class="num">${fmt(s.fuelUsed,1)} kg</td></tr>
      <tr><td>Peak CHT / EGT</td><td class="num">${fmt(s.peakCht,0)} / ${fmt(s.peakEgt,0)} \u00B0C</td></tr>
      <tr><td>Peak vibration</td><td class="num">${fmt(s.peakVib,2)} mm/s RMS</td></tr>
      <tr><td>Peak shaft power</td><td class="num">${fmt(s.maxPower,1)} hp</td></tr></tbody></table>`);
    h.push('<h4>Health assessment</h4>');
    h.push(`<p>Overall condition index <strong style="color:${healthColor(s.health)}">${fmt(s.health,1)} / 100</strong>. Subsystem breakdown:</p>`);
    h.push('<table><tbody>'+Object.values(S.health.subsystems).map(x=>
      `<tr><td>${x.name}</td><td class="num" style="color:${healthColor(x.value)}">${fmt(x.value,1)}</td></tr>`).join('')+'</tbody></table>');
    h.push('<h4>Machine-learning diagnosis</h4>');
    h.push(`<p>Anomaly score ${fmt(s.anomaly,3)} against a decision threshold of 0.380 \u2014 ${s.anomaly>0.38?'<span class="wrn">anomaly declared</span>':'within the nominal manifold'}. Most likely mode: <strong>${R.top?R.top.name:'none'}</strong> at ${R.top?(R.top.p*100).toFixed(1):'0'}% confidence.</p>`);
    h.push('<h4>Remaining useful life</h4>');
    h.push('<table><thead><tr><th>Component</th><th class="num">Wear</th><th class="num">RUL</th><th class="num">90% interval</th></tr></thead><tbody>'+
      R.rul.map(c=>`<tr><td>${c.name}</td><td class="num">${(c.deg*100).toFixed(0)}%</td>
        <td class="num" style="color:${c.rul<25?cssv('--warn'):c.rul<80?cssv('--caution'):cssv('--nominal')}">${fmt(c.rul,0)} h</td>
        <td class="num dimmer">${fmt(c.lo,0)} \u2013 ${fmt(c.hi,0)} h</td></tr>`).join('')+'</tbody></table>');
    h.push(`<h4>Event log (${R.alarms.length} cautions and warnings)</h4>`);
    h.push(R.alarms.length?'<table><tbody>'+R.alarms.slice(-25).reverse().map(e=>
      `<tr><td class="mono dimmer" style="width:74px">${hhmmss(e.t)}</td>
       <td class="${e.sev===2?'wrn':'cau'}" style="width:60px">${e.sev===2?'WARNING':'CAUTION'}</td>
       <td>${e.txt}</td></tr>`).join('')+'</tbody></table>'
      :'<p>No cautions or warnings were recorded during this mission.</p>');
    h.push('<h4>Recommended actions</h4>');
    h.push('<ul>'+R.actions.map(a=>`<li>${a}</li>`).join('')+'</ul>');
    this.out.innerHTML=h.join('');
  },
  update(){},
  seed(){}
};

 ['01','Physical asset and sensor set','Turbocharged 4-cylinder aero-piston engine, 4x EGT, 4x CHT, oil and fuel pressure and temperature, coolant, MAP, IAT, tri-axial accelerometer, filter differential pressure, tacho, bus voltage.','EngineModel'],
 ['02','Data acquisition and conditioning','10 Hz sampling, anti-alias filtering, quantisation and per-channel noise; sensor faults live here so the layers above never see the truth for free.','SensorLayer'],
 ['03','Simulation and scenario control','Mission profile scheduler, manual flight control, and progressive fault injection across 11 seeded failure modes.','PROFILES / FAULT_DEFS'],
 ['04','Telemetry transport','Frame assembly, downlink latency and loss accounting, channel health. The ground segment consumes only what arrives over this link.','Recorder.tick'],
 ['05','Digital twin core','A calibrated healthy-engine model integrated in lock-step at the same commanded operating point. Emits expectations and residuals.','DigitalTwin'],
 ['06','Health monitoring','Condition indices per subsystem from wear state, residual energy and latched exceedances; limit-margin tracking against published limits.','HealthMonitor'],
 ['07','Fault detection','20 deterministic rules combining absolute limits with physics cross-checks, each behind a persistence filter to reject transients.','Diagnostics'],
 ['08','AI/ML predictive analytics and RUL','LSTM autoencoder for anomaly, gradient-boosted classifier for fault mode, Bayesian degradation model for remaining useful life with credible intervals.','MLService'],
 ['09','Visualisation','EICAS-style instrument cluster, time-series canvas plots, residual and attribution views, condition dashboards.','TimeChart / tape / views'],
 ['10','Reporting and replay','1 Hz mission data recorder with scrub and playback; consolidated mission, health, RUL and maintenance-action report.','Recorder / Reporting']

  desc:'How the ten layers stack up, and which module in this build implements each one. Layers carrying live data right now are marked.',
  build(){
    const root=el('div','grid g-2-1');
    const a=panel('Layer stack','BOTTOM-UP');
    a.body.className='panel-body tight';
    const st=el('div','arch');st.style.margin='8px';
    this.rows=LAYERS.map(([n,name,desc,mod])=>{
      const r=el('div','arch-layer');
      r.innerHTML=`<div class="n">${n}</div><div class="c"><h4>${name}</h4><p>${desc}</p>
        <code>${mod}</code> <span class="mono dimmer" style="font-size:10px;float:right" data-rate></span></div>`;
      st.appendChild(r);return {r,rate:r.querySelector('[data-rate]')};
    });
    a.body.appendChild(st);
    root.appendChild(a);

    const side=el('div','grid');
    const fl=panel('Data flow','PER FRAME');
    fl.body.innerHTML=`<pre class="mono" style="font-size:11px;color:var(--ink-2);margin:0;white-space:pre-wrap;line-height:1.7">
throttle, altitude, OAT
  \u2193
EngineModel.step()        ground truth + wear
  \u2193
SensorLayer.read()        noise, faults
  \u2193                     \u2198
DigitalTwin.expect()  \u2192  residuals
  \u2193                     \u2193
Diagnostics.run()     MLService.infer()
  \u2193                     \u2193
HealthMonitor      anomaly \u00B7 mode \u00B7 RUL
  \u2198                     \u2199
      Recorder \u00B7 Views \u00B7 Reporting</pre>`;
    side.appendChild(fl);

    const sp=panel('Runtime','THIS SESSION');
    this.kFps=kv('Frame rate','\u2014');
    this.kSim=kv('Simulated time','\u2014');
    this.kTick=kv('Tick budget','\u2014');
    this.kMem=kv('Recorder frames','\u2014');
    this.kInf=kv('ML inference','\u2014');
    this.kCh=kv('Channels modelled','32');
    [this.kFps,this.kSim,this.kTick,this.kMem,this.kInf,this.kCh].forEach(x=>sp.body.appendChild(x));
    side.appendChild(sp);
    root.appendChild(side);

  },
  update(S){
    this.kSim.val.textContent=hhmmss(S.t)+'  \u00D7'+S.speed;
    this.kMem.val.textContent=S.rec.buf.length.toLocaleString()+' / '+S.rec.cap.toLocaleString();
    this.kInf.val.textContent=fmt(S.ml.infMs,2)+' ms/frame';
    this.kTick.val.textContent=fmt(window.__tickMs||0,2)+' ms';
    this.kFps.val.textContent=fmt(window.__fps||0,0)+' Hz';
    const live=[true,true,S.mode!=='off',true,true,true,S.diag.fired.length>0,S.ml.detected,true,S.rec.buf.length>0];
    this.rows.forEach((x,i)=>{x.r.classList.toggle('live',!!live[i]);});
    if(!this._t||performance.now()-this._t>700){
      this._t=performance.now();
      const rates=['10 Hz','10 Hz',S.mode,'10 Hz','10 Hz','10 Hz',
        S.diag.fired.length+' active','score '+fmt(S.ml.anomalyEma,2),'60 Hz',S.rec.buf.length+' frames'];
      this.rows.forEach((x,i)=>x.rate.textContent=rates[i]);
    }
  },
  seed(){}
};

/* ===== src/ui/Router.js ===== */
const NAVBTN = {};

const NAV=[
  ['Live monitoring',['overview','telemetry','twin','health']],
  ['Diagnosis and prediction',['faults','predictive','rul']],
  ['Operate',['simulation','replay','reports']],
  ['Reference',['architecture']]
];
const ORDER=NAV.flatMap(g=>g[1]);
let current=null;
const getCurrent=()=>current;
const getCurrentView=()=>VIEWS[current];
const clearAlert=()=>{const b=NAVBTN[current];if(b)b.classList.remove('has-alert');};

function buildNav(){
  const nav=$('#nav');
  NAV.forEach(([g,keys])=>{
    nav.appendChild(el('div','rail-group',g));
    keys.forEach(k=>{
      const v=VIEWS[k];
      const b=el('button','navitem');
      b.innerHTML=`<span class="lyr">${v.layer}</span><span>${v.nav}</span><span class="dot"></span>`;
      b.onclick=()=>route(k);
      b.dataset.key=k;
      NAVBTN[k]=b;
      nav.appendChild(b);
    });
  });
}
function buildViews(){
  const host=$('#views');
  ORDER.forEach(k=>{
    const v=VIEWS[k];
    const sec=el('section','view');sec.id='view-'+k;
    const head=el('div','view-head');
    const left=el('div');
    left.appendChild(el('h1','view-title',v.title));
    left.appendChild(el('p','view-desc',v.desc));
    head.appendChild(left);
    head.appendChild(el('div','panel-tag','LAYER '+v.layer));
    sec.appendChild(head);
    v._host=sec;
    host.appendChild(sec);
  });
}
function route(k){
  if(!VIEWS[k])return;
  current=k;
  const v=VIEWS[k];
  if(!v._built){ v._host.appendChild(v.build()); v._built=true; }
  ORDER.forEach(x=>{
    VIEWS[x]._host.classList.toggle('active',x===k);
    const btn=NAVBTN[x];
    if(btn)btn.setAttribute('aria-current',String(x===k));
  });
  try{ v.seed&&v.seed(S); }catch(e){console.error(e);}
  try{ S.sensors&&v.update&&v.update(S); }catch(e){console.error(e);}
  window.scrollTo({top:0,behavior:'instant'});
}

/* --- alert badges on nav -------------------------------------------- */
bus.on('alarm',e=>{
  const map={Combustion:'faults',Lubrication:'faults',Cooling:'faults',Induction:'faults',
    Mechanical:'faults',Fuel:'faults',Electrical:'faults',Sensors:'faults',Power:'faults'};
  const k=map[e.sys]||'faults';
  const b=NAVBTN[k];

});

/* ===== src/ui/StatusStrip.js ===== */
/* --- status strip --------------------------------------------------- */
const STRIP=[
  ['MET',s=>hhmmss(s.t),null],
  ['PHASE',s=>s.phase,null],
  ['RPM',s=>s.sensors.rpm.toFixed(0),s=>sevOf('rpm',s.sensors.rpm)],
  ['MAP',s=>s.sensors.map.toFixed(1),s=>sevOf('map',s.sensors.map)],
  ['EGT',s=>Math.max(...s.sensors.egt).toFixed(0),s=>sevOf('egt',Math.max(...s.sensors.egt))],
  ['CHT',s=>Math.max(...s.sensors.cht).toFixed(0),s=>sevOf('cht',Math.max(...s.sensors.cht))],
  ['OIL P',s=>s.sensors.oilP.toFixed(2),s=>sevOf('oilP',s.sensors.oilP)],
  ['VIB',s=>s.sensors.vibRms.toFixed(1),s=>sevOf('vib',s.sensors.vibRms)],
  ['HEALTH',s=>fmt(s.health.overall,0),s=>s.health.overall<60?2:s.health.overall<80?1:0],
  ['ANOMALY',s=>fmt(s.ml.anomalyEma,2),s=>s.ml.detected?2:s.ml.anomalyEma>0.28?1:0]
];
let STRIP_EL=null, STRIP_BLOCKS=[], MASTERBAR=null, RAILCLOCK=null;
function buildStrip(){
  const strip=STRIP_EL=$('#strip');
  MASTERBAR=$('#masterbar'); RAILCLOCK=$('#railClock');
  const blocks=STRIP.map(([k])=>{
    const b=el('div','strip-block');
    b.appendChild(el('div','k',k));
    const v=el('div','v','--');b.appendChild(v);
    b.val=v;strip.appendChild(b);return b;
  });
  strip.appendChild(el('div','strip-spacer'));
  const ctl=el('div','strip-ctl');
  const bPlay=el('button','btn primary','Pause');
  bPlay.onclick=()=>{S.running=!S.running;bPlay.textContent=S.running?'Pause':'Resume';
    bPlay.classList.toggle('primary',S.running);};
  ctl.appendChild(bPlay);
  [1,5,20].forEach(sp=>{
    const b=el('button','btn mono'+(sp===1?' on':''),'\u00D7'+sp);
    b.onclick=()=>{S.speed=sp;ctl.querySelectorAll('.btn.mono').forEach(x=>x.classList.remove('on'));b.classList.add('on');};
    ctl.appendChild(b);
  });
  const bReset=el('button','btn','Reset');
  bReset.onclick=()=>{resetAll();
    document.querySelectorAll('.toggle').forEach(t=>t.setAttribute('aria-pressed','false'));
    toast('Simulation reset');};
  ctl.appendChild(bReset);
  const bTheme=el('button','btn','Light');
  bTheme.onclick=()=>{const d=document.documentElement;
    const light=d.getAttribute('data-theme')==='light';
    d.setAttribute('data-theme',light?'dark':'light');
    bTheme.textContent=light?'Light':'Dark';};
  ctl.appendChild(bTheme);
  strip.appendChild(ctl);
  STRIP_BLOCKS=blocks;
}
function updateStrip(S){
  STRIP.forEach(([k,get,sev],i)=>{
    const b=STRIP_BLOCKS[i];
    if(!b)return;
    let txt='--',s=0;
    try{txt=get(S);s=sev?sev(S):0;}catch(e){}
    b.val.textContent=txt;
    b.val.className='v '+(s===2?'wrn':s===1?'cau':'');
  });
  const warn=S.diag.fired.some(f=>f.sev===2), caut=S.diag.fired.length>0;
  if(MASTERBAR)MASTERBAR.className='masterbar'+(warn?' warn':caut?' caution':'');
  if(RAILCLOCK)RAILCLOCK.textContent='MET '+hhmmss(S.t);
}

/* ===== src/ui/Shell.js ===== */
function boot(){
  buildNav();buildViews();buildStrip();
  pushEvent({type:'info',sev:0,txt:'AETHER-DT online \u00B7 twin synchronised \u00B7 '+PROFILES[S.profile].name,sys:'Mission',t:0});
  // pre-roll 90 s so every view opens with history rather than an empty frame
  for(let i=0;i<900;i++) tick(0.1);
  route('overview');

  let fpsT=performance.now(),frames=0;
  setInterval(()=>{
    if(!S.running)return;
    const t0=performance.now();
    const steps=S.speed;
    for(let i=0;i<steps;i++) tick(0.1);
    window.__tickMs=lerp(window.__tickMs||0,performance.now()-t0,0.1);
    frames++;
    const now=performance.now();
    if(now-fpsT>1000){window.__fps=frames*1000/(now-fpsT);frames=0;fpsT=now;}
    const v=getCurrentView();
    if(v&&v.update&&S.sensors){ try{v.update(S);}catch(e){console.error('[view]',current,e);} }
    if(S.sensors)updateStrip(S);
    clearAlert();
  },100);

  requestAnimationFrame(rafLoop);

  document.addEventListener('keydown',ev=>{
    if(ev.target.tagName==='INPUT'||ev.target.tagName==='SELECT')return;
    const i=ORDER.indexOf(getCurrent());
    if(ev.key===']'){route(ORDER[(i+1)%ORDER.length]);}
    if(ev.key==='['){route(ORDER[(i-1+ORDER.length)%ORDER.length]);}
    if(ev.key===' '){ev.preventDefault();const b=$('#strip .btn.primary')||$('#strip .btn');
      S.running=!S.running;const pb=$('#strip .strip-ctl .btn');pb.textContent=S.running?'Pause':'Resume';
      pb.classList.toggle('primary',S.running);}
  });
}

document.addEventListener('DOMContentLoaded', boot);
</script>
