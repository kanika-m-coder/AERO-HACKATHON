<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AeroTwin AI · UAV Engine Digital Twin</title>
<link rel="icon" type="image/jpeg" href="./assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/styles/tokens.css">
<link rel="stylesheet" href="./src/styles/app.css">
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="app">
  <nav class="rail" id="sidebarDrawer">
    <div class="brand">
      <div class="brand-mark">
        <img src="./assets/logo.jpg" alt="AeroTwin AI Logo" class="brand-logo-img">
        <span class="brand-name">AeroTwin AI</span>
      </div>
      <div class="brand-sub">MALE UAV · PISTON ENGINE TWIN</div>
      <button type="button" class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close sidebar navigation">✕</button>
    </div>
    <div class="rail-scroll" id="nav"></div>
    <div class="rail-foot">
      <div>BUILD 2.4.1-demo</div>
      <div id="railClock">MET 00:00:00</div>
    </div>
  </nav>

  <div class="main">
    <header class="mobile-header" id="mobileHeader">
      <button type="button" class="mobile-hamburger-btn" id="mobileHamburgerBtn" aria-label="Open navigation sidebar">
        <span class="icon">☰</span>
        <span class="label" id="mobileCurrentModuleLabel">09 Mission overview</span>
      </button>
      <div class="mobile-brand">
        <img src="./assets/logo.jpg" alt="AeroTwin AI Logo" class="mobile-logo-img">
        <span>AeroTwin AI</span>
      </div>
    </header>
    <header class="strip" id="strip"></header>
    <div class="masterbar" id="masterbar"></div>
    <div id="views"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
</body>
</html>
<script type="module" src="./src/main.js"></script>
